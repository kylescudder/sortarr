services:
  sortarr:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:3210:3210'
    environment:
      RADARR_URL: ${RADARR_URL:?Set the URL reachable from inside the container}
      RADARR_API_KEY: ${RADARR_API_KEY:?Set the Radarr API key}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
